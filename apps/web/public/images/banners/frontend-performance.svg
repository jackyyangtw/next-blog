<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="686" viewBox="0 0 1600 686" role="img" aria-labelledby="title desc">
  <title id="title">Frontend Performance Banner</title>
  <desc id="desc">Abstract frontend performance banner showing Core Web Vitals, a fast loading path, and responsive interface panels.</desc>
  <defs>
    <linearGradient id="performanceBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071524"/>
      <stop offset="0.48" stop-color="#10435c"/>
      <stop offset="1" stop-color="#17635d"/>
    </linearGradient>
    <linearGradient id="performanceFlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.12"/>
      <stop offset="0.48" stop-color="#e0f2fe" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0.24"/>
    </linearGradient>
    <linearGradient id="performancePanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#cffafe" stop-opacity="0.84"/>
    </linearGradient>
    <radialGradient id="performanceGlow" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ccfbf1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="performanceGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#e0f2fe" stroke-opacity="0.1"/>
      <circle cx="0" cy="0" r="1.5" fill="#a5f3fc" fill-opacity="0.2"/>
    </pattern>
    <filter id="performanceShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1600" height="686" fill="url(#performanceBg)"/>
  <rect width="1600" height="686" fill="url(#performanceGrid)" opacity="0.68"/>
  <ellipse cx="800" cy="328" rx="582" ry="270" fill="url(#performanceGlow)" opacity="0.24"/>

  <g fill="none" stroke="url(#performanceFlow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 438C272 300 404 486 576 356C728 242 876 232 1030 344C1190 460 1336 316 1490 240" stroke-width="18" opacity="0.76"/>
    <path d="M176 224C330 298 454 168 618 234C776 298 866 188 1012 252C1148 314 1288 184 1428 252" stroke-width="6" opacity="0.4"/>
  </g>

  <g filter="url(#performanceShadow)">
    <rect x="150" y="152" width="372" height="206" rx="24" fill="url(#performancePanel)"/>
    <rect x="1078" y="348" width="372" height="206" rx="24" fill="url(#performancePanel)"/>
    <rect x="594" y="146" width="412" height="350" rx="30" fill="#0f172a" opacity="0.92"/>
  </g>

  <g fill="#0f172a" opacity="0.7">
    <rect x="202" y="204" width="142" height="14" rx="7"/>
    <rect x="202" y="244" width="244" height="10" rx="5"/>
    <rect x="202" y="276" width="178" height="10" rx="5"/>
    <rect x="1130" y="400" width="150" height="14" rx="7"/>
    <rect x="1130" y="440" width="246" height="10" rx="5"/>
    <rect x="1130" y="472" width="182" height="10" rx="5"/>
  </g>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M650 408H938" stroke="#67e8f9" stroke-width="7" opacity="0.56"/>
    <path d="M690 374L754 310L822 338L906 238" stroke="#a7f3d0" stroke-width="10" opacity="0.88"/>
    <path d="M906 238L880 254M906 238L900 268" stroke="#d9f99d" stroke-width="8" opacity="0.9"/>
    <path d="M678 246H772M678 278H736M678 310H756" stroke="#bae6fd" stroke-width="6" opacity="0.72"/>
  </g>

  <g>
    <circle cx="690" cy="374" r="22" fill="#38bdf8"/>
    <circle cx="754" cy="310" r="24" fill="#67e8f9"/>
    <circle cx="822" cy="338" r="25" fill="#a7f3d0"/>
    <circle cx="906" cy="238" r="29" fill="#fef08a"/>
  </g>

  <g fill="#f8fafc" opacity="0.92">
    <rect x="654" y="188" width="130" height="30" rx="15"/>
    <rect x="846" y="392" width="112" height="28" rx="14"/>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="800" text-anchor="middle">
    <text x="719" y="209" fill="#0f172a" font-size="14">WEB VITALS</text>
    <text x="902" y="411" fill="#0f172a" font-size="13">FAST PATH</text>
  </g>

  <g fill="none" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" opacity="0.68">
    <path d="M1190 500h142"/>
  </g>
  <g fill="#0f172a" opacity="0.68">
    <circle cx="432" cy="306" r="34" fill="#86efac"/>
    <circle cx="1360" cy="432" r="34" fill="#67e8f9"/>
  </g>
  <g fill="none" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="7" opacity="0.74">
    <path d="M416 306l11 11l23 -27"/>
    <path d="M1344 432l11 11l23 -27"/>
  </g>

  <g fill="#ffffff" opacity="0.2">
    <circle cx="548" cy="118" r="6"/>
    <circle cx="1040" cy="146" r="7"/>
    <circle cx="1120" cy="252" r="5"/>
    <circle cx="526" cy="532" r="7"/>
    <circle cx="1038" cy="560" r="6"/>
    <circle cx="1296" cy="158" r="5"/>
  </g>
</svg>
