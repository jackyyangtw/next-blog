<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="686" viewBox="0 0 1600 686" role="img" aria-labelledby="title desc">
  <title id="title">Chart Performance Optimization Banner</title>
  <desc id="desc">Abstract chart performance optimization banner with bar charts, trend lines, chart gridlines, and an efficient rendering budget.</desc>
  <defs>
    <linearGradient id="chartBg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#071522"/>
      <stop offset="0.48" stop-color="#123d58"/>
      <stop offset="1" stop-color="#16615d"/>
    </linearGradient>
    <linearGradient id="chartFlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#e0f2fe" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#86efac" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="chartPanel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#d9fdf5" stop-opacity="0.86"/>
    </linearGradient>
    <radialGradient id="chartGlow" cx="50%" cy="48%" r="54%">
      <stop offset="0" stop-color="#ccfbf1" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ccfbf1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="chartGrid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#e0f2fe" stroke-opacity="0.1"/>
      <circle cx="0" cy="0" r="1.5" fill="#a5f3fc" fill-opacity="0.18"/>
    </pattern>
    <filter id="chartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1600" height="686" fill="url(#chartBg)"/>
  <rect width="1600" height="686" fill="url(#chartGrid)" opacity="0.64"/>
  <ellipse cx="800" cy="330" rx="578" ry="268" fill="url(#chartGlow)" opacity="0.3"/>
